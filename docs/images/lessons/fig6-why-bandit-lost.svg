<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 318' width='760' height='318' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><title>Decomposition of the Phase 6 bandit loss</title><rect width='760' height='318' fill='#fcfcfb' rx='8'/><text x='24.0' y='28.0' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='600'>Width was not the problem; exploration and missing context were</text><text x='24.0' y='48.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>Mixed workload, greedy: step throughput relative to the best single arm (composite-g4). * = arithmetic on measured values</text><rect x='24.0' y='62' width='12' height='12' rx='3' fill='#2a78d6'/><text x='42.0' y='72.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>measured</text><rect x='120.0' y='62' width='12' height='12' rx='3' fill='#eb6834'/><text x='138.0' y='72.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>counterfactual: no width-7 or catch-up cost</text><rect x='461.0' y='62' width='12' height='12' rx='3' fill='#1baf7a'/><text x='479.0' y='72.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>oracle ceiling (perfect choice)</text><line x1='270.0' x2='270.0' y1='86' y2='272' stroke='#e6e5e1'/><text x='270.0' y='288.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400'>0.85</text><line x1='360.0' x2='360.0' y1='86' y2='272' stroke='#e6e5e1'/><text x='360.0' y='288.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400'>0.9</text><line x1='450.0' x2='450.0' y1='86' y2='272' stroke='#e6e5e1'/><text x='450.0' y='288.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400'>0.95</text><line x1='540.0' x2='540.0' y1='86' y2='272' stroke='#e6e5e1'/><text x='540.0' y='288.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400'>1</text><line x1='630.0' x2='630.0' y1='86' y2='272' stroke='#e6e5e1'/><text x='630.0' y='288.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400'>1.05</text><line x1='720.0' x2='720.0' y1='86' y2='272' stroke='#e6e5e1'/><text x='720.0' y='288.0' font-size='11' fill='#52514e' text-anchor='middle' font-weight='400'>1.1</text><line x1='540.0' x2='540.0' y1='86' y2='272' stroke='#52514e' stroke-dasharray='4 4'/><text x='260.0' y='107.0' font-size='12' fill='#0b0b0b' text-anchor='end' font-weight='400'>UCB1, as measured</text><rect x='270.0' y='95' width='181.5' height='18' rx='3' fill='#2a78d6'><title>UCB1, as measured: 0.9508131109105379</title></rect><text x='457.5' y='108.0' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='600'>0.951</text><text x='260.0' y='137.0' font-size='12' fill='#0b0b0b' text-anchor='end' font-weight='400'>UCB1, every arm at its own width*</text><rect x='270.0' y='125' width='205.3' height='18' rx='3' fill='#eb6834'><title>UCB1, every arm at its own width*: 0.9640596463542671</title></rect><text x='481.3' y='138.0' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='600'>0.964</text><text x='260.0' y='167.0' font-size='12' fill='#0b0b0b' text-anchor='end' font-weight='400'>Thompson, as measured</text><rect x='270.0' y='155' width='188.7' height='18' rx='3' fill='#2a78d6'><title>Thompson, as measured: 0.9548583209102224</title></rect><text x='464.7' y='168.0' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='600'>0.955</text><text x='260.0' y='197.0' font-size='12' fill='#0b0b0b' text-anchor='end' font-weight='400'>Thompson, every arm at its own width*</text><rect x='270.0' y='185' width='270.8' height='18' rx='3' fill='#eb6834'><title>Thompson, every arm at its own width*: 1.0004410275275366</title></rect><text x='546.8' y='198.0' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='600'>1.000</text><text x='260.0' y='227.0' font-size='12' fill='#0b0b0b' text-anchor='end' font-weight='400'>Best arm per prompt set*</text><rect x='270.0' y='215' width='356.7' height='18' rx='3' fill='#1baf7a'><title>Best arm per prompt set*: 1.0481518475121132</title></rect><text x='632.7' y='228.0' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='600'>1.048</text><text x='260.0' y='257.0' font-size='12' fill='#0b0b0b' text-anchor='end' font-weight='400'>Best arm per prompt*</text><rect x='270.0' y='245' width='414.4' height='18' rx='3' fill='#1baf7a'><title>Best arm per prompt*: 1.0802380741939623</title></rect><text x='690.4' y='258.0' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='600'>1.080</text><text x='24.0' y='312.0' font-size='11' fill='#52514e' text-anchor='start' font-weight='400'>Axis starts at 0.85 to show the gaps; every bar is a ratio to the same best single arm.</text></svg>
name: CI

on:
  push:
    branches: [main, dev]
  # Every PR, whatever its base: stacked PRs (base = another feature
  # branch) get CI too.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: lint ──────────────────────────────────────────────────────────────
  # ruff check, ruff format --check, import-linter, and mypy --strict.
  # pip-audit fails the job only when its output contains CRITICAL.
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -e ".[dev,gpu]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: make lint
        run: make lint
      - name: make typecheck
        run: make typecheck
      - name: pip-audit (fail on CRITICAL CVE)
        run: |
          pip install pip-audit
          set +e
          pip-audit --strict --vulnerability-service pypi -r <(pip freeze) 2>&1 | tee pip-audit.txt
          set -e
          if grep -q "CRITICAL" pip-audit.txt; then
            exit 1
          fi

  # ── Job 2: test-cpu ──────────────────────────────────────────────────────────
  test-cpu:
    name: test-cpu
    runs-on: ubuntu-22.04
    needs: lint
    env:
      TRITON_CPU_BACKEND: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,gpu]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: make test
        run: make test

  # ── Job 3: test-chaos ────────────────────────────────────────────────────────
  test-chaos:
    name: test-chaos
    runs-on: ubuntu-22.04
    needs: lint
    env:
      TRITON_CPU_BACKEND: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,gpu]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: make test-chaos
        run: make test-chaos

  # ── Job 4: onnx-parity ───────────────────────────────────────────────────────
  onnx-parity:
    name: onnx-parity
    runs-on: ubuntu-22.04
    needs: test-cpu
    env:
      TRITON_CPU_BACKEND: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with ONNX extras
        run: |
          pip install -e ".[dev,onnx,gpu]" \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run ONNX parity tests
        run: pytest tests/integration/test_onnx_parity.py -v --no-cov

  # ── Job 5: docs-build ────────────────────────────────────────────────────────
  docs-build:
    name: docs-build
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install docs dependencies
        run: pip install -e ".[docs]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: make docs
        run: make docs

  # ── Job 6: paper ─────────────────────────────────────────────────────────────
  # Builds paper/flashspec.tex. Does not depend on lint.
  paper:
    name: paper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the draft PDF
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3.3.0
        with:
          root_file: flashspec.tex
          working_directory: paper
      - name: Upload the draft PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flashspec-draft
          path: paper/flashspec.pdf

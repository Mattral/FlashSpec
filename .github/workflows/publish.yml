name: Publish

# Manual publish with PyPI Trusted Publishing. The maintainer starts it;
# nothing triggers it automatically.
#
# 1. Merge the version bump into main.
# 2. Tag that main commit `v<version>` (the version in pyproject.toml) and
#    push the tag.
# 3. Actions -> Publish -> Run workflow, and pick the tag (not a branch)
#    under "Use workflow from".
#
# The verify job refuses to continue unless the run is on a tag, the tag is
# exactly "v" + the pyproject version, the tagged commit is on main, and the
# CPU test suite passes. The publish job then uses the GitHub environment
# `pypi`, which requires a reviewer. No API token or repository secret is
# stored here. Every action is pinned to a commit SHA (the tag in the
# trailing comment is the one it pointed to when pinned).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  verify:
    name: verify (tag, version, tests, build)
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse anything but a tag ref
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run this workflow on a v<version> tag, not ${GITHUB_REF}."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Tag must equal "v" + pyproject version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"::error::tag {tag!r} != 'v' + pyproject version {version!r}")
          print(f"tag {tag} matches pyproject version {version}")
          PY
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} (tag ${GITHUB_REF_NAME}) is not on origin/main."
            exit 1
          fi
      - name: Install
        run: pip install -e ".[dev,gpu]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Tests (CPU, not gpu)
        env:
          TRITON_CPU_BACKEND: "1"
        run: pytest tests/unit tests/integration -m "not gpu"
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
          version="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/flashspec-${version}.tar.gz"
          test -f "dist/flashspec-${version}-py3-none-any.whl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/flashspec
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

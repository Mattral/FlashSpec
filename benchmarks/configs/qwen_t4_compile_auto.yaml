# 0.2.0 release measurement on a Colab Tesla T4: qwen_t4_compile.yaml with
# flashspec_compiled built the way a default user gets it.
#
# Identical to qwen_t4_compile.yaml (same pair, prompts, modes, lengths,
# warmups and the same seven methods) except for one key:
#
#   flashspec_compile: auto
#
# flashspec_compiled then runs with FlashSpecConfig(compile="auto"), so the
# engine decides on/off itself (CUDA + Triton -> on) and its result records
# the requested value, whether it was effective, and the decision line.
# flashspec_ucb stays eager (compile=False) as the "before".
#
# Run it from a commit on main through notebooks/04_gpu_measurement.ipynb
# (cells 1, 2 and 3c). The README table for 0.2.0 is generated from this
# bundle only.

model: Qwen/Qwen2.5-1.5B-Instruct
drafter: Qwen/Qwen2.5-0.5B-Instruct
device: cuda:0
dtype: float16
gamma: 4
batch_size: 1
max_new_tokens: 128
n_warmup: 2
n_samples: 10
seed: 0
chat_template: true
compile_max_cache_len: 1024
flashspec_compile: auto

datasets:
  - mt_bench
  - humaneval

temperatures:
  - 0.0
  - 0.7

methods:
  - flashspec_ucb
  - flashspec_compiled
  - hf_greedy
  - hf_greedy_compiled
  - hf_sample
  - hf_sample_compiled
  - hf_assisted

# CPU correctness run of the Phase 6 runner (qwen_t4_phase6.yaml's shape)
# on a random tiny Llama pair with a character tokenizer. Not a speed
# measurement and not a checkpoint: acceptance on random weights means
# nothing. Prompts are capped per block to keep it short.

runner: phase6
model: toy_llama
drafter: toy_llama
device: cpu
dtype: float32
max_new_tokens: 24
n_warmup: 1
seed: 0
chat_template: false
compile: auto
vocab_size: 128
target_hidden: 64
target_layers: 3
drafter_hidden: 32
drafter_layers: 2
initializer_range: 0.1

temperatures:
  - 0.0
  - 0.7

arms:
  - {label: qwen-g2, drafter: model, gamma: 2}
  - {label: qwen-g4, drafter: model, gamma: 4}
  - {label: ngram-g4, drafter: ngram, gamma: 4}
  - {label: composite-g4, drafter: ngram, gamma: 4, fallback: model}

bandits:
  - ucb1
  - thompson

blocks:
  - dataset: humaneval_edit
    n_prompts: 3
    methods: [fixed_arms, bandits, hf_greedy, hf_greedy_compiled, hf_sample_compiled]
  - dataset: mixed
    n_prompts: 4
    methods: [fixed_arms, bandits, flashspec_compiled_legacy, bandit_ucb1_legacy]

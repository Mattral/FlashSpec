# In-process random tiny Llama pair. Not a checkpoint measurement.
# Unlike tiny_cpu.yaml, these are HuggingFace modules with a real KV cache
# and generate(), so the cached engine paths and the HuggingFace baselines
# run here: hf_sample and hf_assisted at this temperature, hf_greedy in
# tiny_llama_cpu_greedy.yaml. Safe to edit: no published numbers are tied
# to this file.

model: toy_llama
drafter: toy_llama
device: cpu
dtype: float32
gamma: 4
batch_size: 1
max_new_tokens: 64
n_warmup: 2
n_samples: 10
prompt_length: 16
vocab_size: 512
target_hidden: 64
target_layers: 4
drafter_hidden: 32
drafter_layers: 2
initializer_range: 0.1
seed: 0
dataset: synthetic_prompts
temperature: 1.0

methods:
  - flashspec_ucb
  - vanilla_ar
  - hf_sample
  - hf_assisted

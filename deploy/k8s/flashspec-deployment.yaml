apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashspec
  labels:
    app: flashspec
    version: "0.3.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flashspec
  template:
    metadata:
      labels:
        app: flashspec
    spec:
      containers:
        - name: flashspec
          # GPU-oriented image; the default command serves Qwen2.5-1.5B-Instruct
          # verified by Qwen2.5-0.5B-Instruct in fp16 on port 8000.
          image: ghcr.io/mattral/flashspec:0.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            # The first start downloads both checkpoints and compiles CUDA graphs.
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "64Gi"
            requests:
              nvidia.com/gpu: "1"
              memory: "32Gi"
          volumeMounts:
            - name: hf-cache
              mountPath: /home/flashspec/.cache/huggingface
      volumes:
        - name: hf-cache
          emptyDir: {}
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

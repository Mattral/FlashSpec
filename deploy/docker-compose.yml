# FlashSpec server from the published image (GPU-oriented; needs the NVIDIA
# Container Toolkit). The image's default command serves Qwen2.5-1.5B-Instruct
# verified by Qwen2.5-0.5B-Instruct in fp16 on port 8000; add `command:` with
# `python -m flashspec.serve` arguments to change it.
#
#   docker compose -f deploy/docker-compose.yml up

services:
  flashspec:
    image: ghcr.io/mattral/flashspec:0.3.1
    ports:
      - "8000:8000"
    volumes:
      # Keep downloaded checkpoints between runs (the image runs as a non-root user).
      - hf_cache:/home/flashspec/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf_cache:
